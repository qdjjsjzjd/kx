<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>$ Кейсы</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#0f1117;--panel:#1a1d27;--line:#2a2f3d;--text:#eef0f6;--muted:#8b92a8;--accent:#6c8cff;--ok:#3ecf8e;--bad:#ff5c6c}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#f2f4fa;--panel:#fff;--line:#dde1ee;--text:#171a24;--muted:#6a7189;--accent:#4a68e8}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.me{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:700;min-width:0}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.bal{background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:12px;font-weight:700;white-space:nowrap}
.avt{display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none;border:2px solid var(--line);color:#fff;text-shadow:0 1px 3px #0008}
nav{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
nav button{flex:0 0 auto;white-space:nowrap;padding:10px 12px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;font-size:14px;cursor:pointer}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sec{display:none}.sec.on{display:block}
h3{margin:16px 0 8px;font-size:16px}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.case{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.case .big{font-size:40px}.case small{color:var(--muted);display:block;margin:4px 0 8px;font-size:13px}
.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.btn.alt{background:var(--line);color:var(--text)}
.btn.sm{padding:6px;font-size:12px}
.rw{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 0;min-height:176px}
.rw::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--accent);transform:translateX(-50%);z-index:2}
.strip{display:flex;gap:8px;will-change:transform}
.card{flex:none;width:112px;border-radius:12px;padding:10px 6px;text-align:center;color:#fff;border:2px solid #888;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.card .ic{font-size:36px}.card .nm{font-weight:700;font-size:13px}.card .bgn{font-size:11px;opacity:.9;min-height:14px}.card .pr{font-size:12px;font-weight:700;margin-top:4px}
.t1{border-color:#9aa0b0}.t2{border-color:#4aa3ff}.t3{border-color:#a566ff}.t4{border-color:#ff5cc8}.t5{border-color:#ffc83d;box-shadow:0 0 12px #ffc83d88}
.res{text-align:center;margin-top:12px;min-height:20px}.res .card{margin:0 auto 8px;width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.grid .card{width:auto}
.item{display:flex;flex-direction:column;gap:5px}
.item.pick .card{outline:3px solid var(--ok)}
.item .row{display:flex;gap:5px}.item .row .btn{flex:1}
.mk .sub{font-size:12px;text-align:center;color:var(--muted)}
.good{color:var(--ok)}.bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.pf{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.pf input{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:16px;width:100%;max-width:220px}
.show{display:flex;gap:6px;flex-wrap:wrap}.show .card{width:86px;padding:6px 2px}.show .card .ic{font-size:26px}.show .card .nm{font-size:11px}.show .card .bgn{display:none}.show .card .pr{font-size:10px}
.avs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.avs .avt{cursor:pointer}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10}.modal.on{display:flex}
.mb{background:var(--panel);padding:16px;border-radius:14px;max-width:320px;width:90%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.mb .card{width:140px}.mb input{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:16px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
.toast.show{opacity:1}
.foot{text-align:center;margin-top:20px}
.bdg{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}.bdg[hidden]{display:none}#stList{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}.stk{margin-bottom:0}.mb select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px}.chbox{height:45vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}.msg{display:flex;gap:8px;font-size:14px;word-break:break-word}.msg small{color:var(--muted)}.msg b{cursor:pointer}.chrow{display:flex;gap:6px;margin-top:8px}.chrow input{flex:1;min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
.lb{display:flex;flex-direction:column;gap:6px}
.lr{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.lr.me{border-color:var(--accent)}.lr .rk{width:30px;font-weight:700;color:var(--muted)}.lr .nn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.stk .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stk svg{width:100%;height:90px;display:block;margin:8px 0}
.stk .row{display:flex;gap:6px}.stk .row .btn{flex:1;padding:8px 2px;font-size:13px}
.bal{padding:7px 10px;font-size:13px}.r2{display:flex;gap:5px}.r2 .btn{flex:1;padding:8px 4px;font-size:13px}.ev{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}.case s{color:var(--muted);font-size:12px}
.fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}.fx i{position:absolute;top:-30px;font-style:normal;animation:fall 2.4s ease-in forwards}@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}.fx .fl{position:absolute;inset:0;animation:fl .9s ease-out forwards}@keyframes fl{from{opacity:1}to{opacity:0}}@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}.res .card{animation:pop .5s}@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}.shake{animation:shk .6s}@media(prefers-reduced-motion:reduce){.fx{display:none}.shake{animation:none}}
.mapw{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:8px 0 10px}.mapw svg{display:block;width:100%;height:auto;cursor:crosshair;touch-action:manipulation}
#map select{flex:1;min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;width:100%}
#mapSel select{margin-bottom:8px}#bizList .r2{margin-top:5px}#bizList .r2 .btn{padding:7px 2px;font-size:12px}

/* ===== Тема: неон + стекло ===== */
:root{--bg:#0a0b14;--panel:#141627;--line:#262a45;--text:#f1f3ff;--muted:#8f95b8;--accent:#7c6cff;--accent2:#22d3ee;--ok:#34e0a1;--bad:#ff5d7a;--grad:linear-gradient(135deg,#7c6cff,#22d3ee);--r:18px;--sh:0 10px 30px #0007;--sea:#080b1d;--land:#2c3568;--lands:#5a66b8;--fd:"Unbounded","Manrope",system-ui,sans-serif;--fb:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef0fb;--panel:#ffffff;--line:#dcdff2;--text:#14172b;--muted:#68709a;--accent:#5b4bf0;--accent2:#0ea5c6;--ok:#12a874;--bad:#e5385a;--sh:0 10px 28px #3a3f7a22;--sea:#e3eaff;--land:#ffffff;--lands:#9aa6e0}}
body{font-family:var(--fb);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.005em;background:radial-gradient(900px 520px at 8% -8%,#7c6cff30,transparent 60%),radial-gradient(800px 520px at 100% 0,#22d3ee1f,transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
header{position:sticky;top:0;z-index:8;margin:-12px -12px 12px;padding:10px 12px;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.me span{font-family:var(--fd);font-size:13px;font-weight:600}
.avt{border:2px solid transparent;background-clip:padding-box;box-shadow:0 0 0 2px var(--accent),0 4px 14px #0005}
.bal{font-family:var(--fd);font-size:11px;font-weight:600;padding:8px 12px;border-radius:999px;background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box;border:1px solid transparent}
nav{scrollbar-width:none;padding:6px 4px 14px;margin:-6px -4px 0}nav::-webkit-scrollbar{display:none}
nav button{font-family:var(--fb);font-weight:700;font-size:13px;padding:9px 15px;border-radius:999px;background:color-mix(in srgb,var(--panel) 85%,transparent);color:var(--muted);transition:.2s}
nav button:hover{color:var(--text);border-color:var(--accent)}
nav button.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 18px #7c6cff55}
h3{font-family:var(--fd);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--grad)}
.hint{line-height:1.45}
.case,.stk,.pf,.rw,.lr,.chbox,.ev,.mb{border-radius:var(--r);background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 90%,#fff 10%),var(--panel));box-shadow:var(--sh)}
.ev{border:1px solid transparent;background:linear-gradient(135deg,#7c6cff24,#22d3ee1a) padding-box,linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box}
.case{transition:.2s;padding:16px 12px}.case:hover{transform:translateY(-3px);border-color:var(--accent)}
.case .big{font-size:46px;filter:drop-shadow(0 6px 14px #7c6cff66)}
.case b{font-family:var(--fd);font-size:12px;font-weight:600}
.btn{font-family:var(--fb);font-weight:800;border-radius:13px;background:var(--grad);box-shadow:0 6px 18px #7c6cff44;transition:transform .15s,filter .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.1)}.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{box-shadow:none;filter:grayscale(.6)}
.btn.alt{background:color-mix(in srgb,var(--panel) 80%,var(--line));color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.alt:hover:not(:disabled){border-color:var(--accent)}
input,select{font-family:var(--fb);font-weight:600;border-radius:12px!important;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 3px #7c6cff33}
.chip{font-weight:700;background:color-mix(in srgb,var(--panel) 80%,var(--line))}
.bdg{background:linear-gradient(135deg,#ff5d7a,#ff8a5c);font-weight:800}
.card{position:relative;overflow:hidden;border-radius:16px;border-width:2px;box-shadow:0 6px 16px #0006;font-weight:700}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,#ffffff30 48%,transparent 66%);transform:translateX(-60%)}
.card .ic{filter:drop-shadow(0 4px 8px #0007)}.card .nm{font-family:var(--fd);font-size:10px;font-weight:600;letter-spacing:.02em}
.card .pr{font-family:var(--fd);font-size:10px}
.t1{border-color:#9aa0b0}.t2{border-color:#4aa3ff;box-shadow:0 6px 18px #4aa3ff33}.t3{border-color:#a566ff;box-shadow:0 6px 20px #a566ff44}
.t4{border-color:#ff5cc8;box-shadow:0 6px 24px #ff5cc866}.t5{border-color:#ffc83d;box-shadow:0 0 22px #ffc83d99}
.t4::after,.t5::after{animation:sheen 3s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(-70%)}55%,100%{transform:translateX(70%)}}
.rw{padding:16px 0;min-height:190px;background:linear-gradient(180deg,#0000,#0000),var(--panel)}
.rw::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,var(--panel),transparent 14%,transparent 86%,var(--panel))}
.rw::after{width:3px;background:var(--grad);box-shadow:0 0 14px var(--accent2),0 0 28px #7c6cff88}
.res{font-weight:700}.res .card{width:150px}
.item.pick .card{outline:3px solid var(--ok);outline-offset:2px}
.lr{transition:.15s}.lr:hover{border-color:var(--accent)}.lr.me{background:linear-gradient(135deg,#7c6cff26,#22d3ee18),var(--panel);border-color:var(--accent)}
.lr .rk{font-family:var(--fd);font-size:13px}
.stk .top b{font-family:var(--fb);font-weight:800}
.stk svg{filter:drop-shadow(0 2px 6px #0004)}
.chbox{padding:12px}.msg b{font-weight:800}
.modal{background:#05060fb8;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mb{padding:20px;border:1px solid var(--line);box-shadow:0 20px 60px #000a}
.toast{border-radius:999px;background:color-mix(in srgb,var(--panel) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--accent);box-shadow:0 10px 30px #0008;font-weight:700;font-size:14px}
.mapw{background:var(--sea);box-shadow:var(--sh)}.mapw svg{background:var(--sea)}
.foot{padding:10px 0 24px}

.upbox{background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 90%,#fff 10%),var(--panel));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.upwheel{--p:70;position:relative;width:170px;height:170px;margin:4px auto;border-radius:50%;background:conic-gradient(var(--ok) 0 calc(var(--p)*1%),var(--bad) calc(var(--p)*1%) 100%);box-shadow:0 0 28px #7c6cff44,inset 0 0 0 3px #0003}
.upwheel::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--panel)}
.upneedle{position:absolute;left:50%;top:0;width:4px;height:50%;margin-left:-2px;transform-origin:50% 100%;z-index:2}
.upneedle::before{content:"";position:absolute;left:-5px;top:-4px;border:7px solid transparent;border-top:0;border-bottom:16px solid var(--text);filter:drop-shadow(0 2px 4px #0008)}
.upneedle::after{content:"";position:absolute;left:0;top:10px;width:4px;height:calc(100% - 10px);border-radius:2px;background:var(--text);opacity:.85}
.upmid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;font-family:var(--fd);font-size:22px;font-weight:700}
.uppair{display:flex;align-items:center;justify-content:center;gap:8px}.uparr{font-size:22px;color:var(--muted)}
.upslot{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted);padding:6px 0}.upslot .card{width:110px;padding:8px 4px}.upslot .card .ic{font-size:30px}
.uprange{display:flex;gap:12px;align-items:center}.uprange input{padding:0;accent-color:var(--accent)}.uprange b{font-family:var(--fd);font-size:14px;min-width:52px;text-align:right}
.item.pick2 .card{outline:3px solid var(--accent2,#22d3ee);outline-offset:2px}.item{cursor:pointer}
.mres{display:flex;flex-direction:column;gap:10px;align-items:stretch}.mres .grid .card{width:auto}.mres .sum{text-align:center;line-height:1.5}
.mres .grid{max-height:420px;overflow:auto;padding:2px}
.case .r2{margin-top:8px}.case .r2:empty{display:none}.case .r2 .btn{padding:9px 4px;font-size:13px}
@media(prefers-reduced-motion:reduce){.t4::after,.t5::after{animation:none}.case,.btn{transition:none}}

.menu{position:relative;flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.menu .bdg{position:absolute;top:-6px;right:-6px}
header{justify-content:flex-start}.me{margin-right:auto}
.drawer{position:fixed;inset:0;z-index:40;display:none;background:#05060fb8;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}.drawer.on{display:block}
.dp{position:absolute;left:0;top:0;bottom:0;width:min(290px,84vw);background:var(--panel);border-right:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;overflow-y:auto;box-shadow:var(--sh)}
.dp .tb{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:transparent;color:var(--text);font-family:var(--fb);font-weight:700;font-size:15px;cursor:pointer}
.dp .tb.on{background:var(--grad);border-color:transparent;color:#fff}
.dp .sp{flex:1}.dp .r2{margin-top:6px}
.fld{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:16px;width:100%;margin-bottom:8px}
.idrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;flex-wrap:wrap}.idrow b{font-family:var(--fd);font-size:12px;word-break:break-all}
#offers:empty{display:none}
</style>
</head>
<body>
<header><button class="menu" id="mbtn" aria-label="Menu">☰<span class="bdg" id="bdg" hidden></span></button><div class="me" data-a="tab" data-v="prof" id="head"></div><div class="bal">💰 <span id="bal">0</span> $ · 💎 <span id="gem">0</span></div></header>
<div class="drawer" id="drawer"><div class="dp" id="dp">
<button class="tb on" data-a="tab" data-v="cases"><span data-t="Магазин"></span></button>
<button class="tb" data-a="tab" data-v="mk"><span data-t="Рынок"></span></button>
<button class="tb" data-a="tab" data-v="trd"><span data-t="Обмен"></span></button>
<button class="tb" data-a="tab" data-v="map"><span>🌍 <span data-t="Карта"></span></span></button>
<button class="tb" data-a="tab" data-v="st"><span data-t="Акции"></span></button>
<button class="tb" data-a="tab" data-v="inv"><span data-t="Инвентарь"></span></button>
<button class="tb" data-a="tab" data-v="up"><span>⚡ <span data-t="Апгрейд"></span></span></button>
<button class="tb" data-a="tab" data-v="prof"><span data-t="Профиль"></span><span class="bdg" id="bdg2" hidden></span></button>
<div class="sp"></div>
<div class="r2"><button class="btn alt" data-a="lang" data-v="ru" id="lru">Русский</button><button class="btn alt" data-a="lang" data-v="en" id="len">English</button></div>
</div></div>

<section id="cases" class="sec on">
  <div class="ev" id="evBox"></div>
  <div class="stk" id="dailyBox"></div><p class="hint" id="taxInfo"></p>
  <h3 data-t="Кейсы"></h3>
  <div class="cases" id="caseList"></div>
  <h3 data-t="Обмен валюты"></h3><div id="exch"></div>

/* Акции (общие для всех, каждые 10 минут) */
const EVT=6e5,GX=5000;let evS=-1;
function evNow(){const k=Math.floor(Date.now()/EVT),r=h32(k*7919+13),q=h32(k*104729+7);let e;
  if(r<.5){const c=Math.floor(q*13),p=[10,15,20,25][Math.floor(h32(k+99)*4)];e={t:"c",k:c,pct:p,txt:`${CASES[c].n} −${p}%`}}
  else if(r<.68)e={t:"all",pct:7,txt:tt("Все кейсы −7%")};
  else if(r<.84)e={t:"sell",txt:tt("Скупка: карточки продаются на 10% дороже")};
  else e={t:"gx",txt:tt("Курс гемов: 1 💎 = {0} $",fmt(GX*.7))};
  e.end=(k+1)*EVT;return e}
function disc(c){if(c.gem)return 0;const e=evNow();return e.t==="all"||(e.t==="c"&&e.k===c.id)?e.pct:0}
const cprice=c=>Math.round(c.price*(1-disc(c)/100)/10)*10;
const gxRate=()=>evNow().t==="gx"?GX*.7:GX;
const sellRate=()=>SELL+(evNow().t==="sell"?.1:0);
function rEv(){const e=evNow(),k=e.end/EVT-1,ch=evS>=0&&k!==evS;evS=k;
  if(ch){toast(tt("🔥 Новая акция: {0}",e.txt));rCases();return}
  const l=Math.max(0,Math.ceil((e.end-Date.now())/1000));
  $("evBox").innerHTML=`🔥 <b>${tt("Акция:")}</b> ${e.txt}<br><span class="hint">${tt("осталось {0}",Math.floor(l/60)+":"+String(l%60).padStart(2,"0"))}</span>`}

const LOCAL_PROMOS={BITCOINUP:{cs:{9:1}}};
async function promo(){
  const code=$("pcIn").value.toUpperCase().replace(/[^A-Z0-9А-ЯЁ_-]/g,""),msg=t=>$("pcMsg").textContent=t;
  if(!code){msg(tt("Введи код"));return}
  if(S.codes.includes(code)){msg(tt("Ты уже активировал этот код"));return}
  let p=LOCAL_PROMOS[code],remote=0;
  if(!p){if(!DB_URL){msg(tt("Код не найден (онлайн недоступен)"));return}
    try{p=await db("promos/"+code)}catch(e){msg(tt("Нет связи 😕"));return}remote=1}
  if(!p||typeof p!=="object"){msg(tt("Такого кода нет"));return}
  if(p.exp&&Date.now()>p.exp){msg(tt("Срок действия кода истёк"));return}
  if(p.maxbal&&S.bal>p.maxbal){msg(tt("Код только для игроков с балансом до {0} $",fmt(p.maxbal)));return}
  const used=p.used&&typeof p.used==="object"?p.used:{};
  if(used[S.uid]){msg(tt("Ты уже активировал этот код"));return}
  if(p.max&&Object.keys(used).length>=p.max){msg(tt("Лимит активаций исчерпан"));return}
  if(remote){try{await db(`promos/${code}/used/${S.uid}`,"PUT",true)}catch(e){msg(tt("Не удалось активировать"));return}}
  const kx=Math.min(Math.max(0,+p.kx||0),1e9),gm=Math.min(Math.max(0,+p.gem||0),1e6),got=[];
  if(kx){S.bal+=kx;got.push(fmt(kx)+" $")}if(gm){S.gem+=gm;got.push(gm+" 💎")}
  for(const[i,n]of Object.entries(p.cs||{})){const c=CASES[+i],q=Math.min(Math.max(0,+n||0),100);if(c&&q){S.cases[c.id]=(S.cases[c.id]||0)+q;got.push(`${q}× ${c.n}`)}}
  S.codes.push(code);$("pcIn").value="";msg(tt("Активирован ✅ Получено: {0}",got.join(", ")||tt("ничего")));toast(tt("Промокод активирован 🎟"));sfx("coin");fx(["🎟","✨"],24);upd()}

  const t=Math.min(Math.floor(taxDay(S.bal)*Math.min(m,4320)/1440),Math.floor(S.bal*.5));if(t>0){S.bal-=t;S.taxPaid+=t}return t}

const STK0=[["AAPL","Apple","🍎",1200,.015],["MSFT","Microsoft","🪟",2800,.014],["GOOG","Google","🔍",2400,.018],["AMZN","Amazon","📦",2100,.02],["META","Meta","♾️",1700,.025],["NFLX","Netflix","🎬",1500,.026],["TSLA","Tesla","🚗",3000,.028],["NVDA","Nvidia","🟢",4500,.03],["GOLD","Золото","🥇",2000,.008],["OIL","Нефть","🛢️",900,.02],["BTC","Bitcoin","₿",18000,.04],["ETH","Ethereum","💠",9000,.035],["KXC","$ Coin","🪙",500,.05],["DOGE","Dogecoin","🐕",150,.06],["GME","GameStop","🕹️",600,.07]].map(a=>({k:a[0],get n(){return tt(a[1])},i:a[2],b:a[3],v:a[4]}));
let STK=STK0.slice(),stSig="";const STK_COST=4e5,CAPFULL=1e6,hk=t=>{let h=7;for(const c of t)h=Math.imul(h,31)+c.charCodeAt(0)|0;return h&0x3fffffff};
const h32=a=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const gaussAt=(ki,t)=>{const u1=h32(Math.imul(t,0x9E3779B1)^Math.imul(ki+1,0x85EBCA6B)^1),u2=h32(Math.imul(t,0x9E3779B1)^Math.imul(ki+1,0x85EBCA6B)^2);return Math.sqrt(-2*Math.log(1-u1))*Math.cos(2*Math.PI*u2)};
const stepP=(a,p,g)=>Math.min(a.b*3,Math.max(a.b*.3,Math.round(p*Math.exp(a.v*(a.vm||1)*.6*g+(a.dr||0)-.03*Math.log(p/a.b)))));
/* Цены считаются из времени, поэтому у всех игроков одинаковые */
const STEP=3e3;let MK={step:-1,p:{},h:{}};
function mkSync(){const st=Math.floor(Date.now()/STEP);if(st===MK.step)return false;const from=Math.floor(st/1000)*1000-1000;
  STK.forEach((a,ki)=>{let p=a.b;const h=[];for(let t=from;t<=st;t++){p=stepP(a,p,gaussAt(a.ki??ki,t));if(t>st-80)h.push(p)}MK.p[a.k]=p;MK.h[a.k]=h;if(a.cus)S.lp[a.k]=p});MK.step=st;return true}
function chart(h,up){const mn=Math.min(...h),mx=Math.max(...h),r=mx-mn||1;

  return `<svg viewBox="0 0 300 90" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--${up?"ok":"bad"})" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`}

  STK.forEach(a=>{const h=MK.h[a.k],p=MK.p[a.k],pr=h[h.length-2]||p,d=(p-pr)/pr*100,q=S.st[a.k]||0,e=$("s-"+a.k);
    e.querySelector(".pp").textContent=fmt(p)+" $";const dd=e.querySelector(".dd");dd.className="dd "+(d>=0?"good":"bad");dd.textContent=(d>=0?"▲ ":"▼ ")+Math.abs(d).toFixed(2)+"%";
    e.querySelector(".cc").innerHTML=chart(h,h[h.length-1]>=h[0]);e.querySelector(".hh").textContent=tt("В портфеле: {0} шт · ≈ {1} $",fmt(q),fmt(q*p));
    const b=e.querySelectorAll("button");b[0].disabled=S.bal<p*1.03;b[1].disabled=S.bal<p*10.3;b[2].disabled=b[3].disabled=q<1})}

async function pullStocks(){if(!DB_URL)return;
  try{const[c,o]=await Promise.all([db("stocks"),db("sov")]),cu=c||{},ov=o||{},lim=(x,a,b)=>Math.min(b,Math.max(a,+x||0));

  S.bal+=Math.round(b.inv*.5+b.cash);S.biz=S.biz.filter(x=>x!==b);sfx("coin");toast(tt("Бизнес продан"));rMapSvg();upd()}
};
$("mReg").innerHTML=VIEWS.map((v,i)=>`<option value="${i}">${v[0]}</option>`).join("")+`<option value="c">${tt("Вокруг города")}</option>`;
$("mCity").innerHTML=`<option value="">${tt("Выбрать город…")}</option>`+CITIES.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join("");
$("mReg").onchange=e=>{const v=VIEWS[+e.target.value];if(v){VW=v.slice(1);rMapSvg()}};
$("mCity").onchange=e=>{const c=CITIES[+e.target.value];if(!c)return;const x=Math.max(0,Math.min(300,c[1]+150)),y=Math.max(0,Math.min(140,70-c[2]));
  VW=[x,y,60,40];$("mReg").value="c";setPt(c[1],c[2])};
$("mapSvg").onclick=e=>{const sv=$("mapSvg"),p=sv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(sv.getScreenCTM().inverse());setPt(q.x-180,90-q.y)};
document.addEventListener("change",e=>{if(e.target.id==="mType"){MT=e.target.value;rMapSel()}});
function rMap(){rMapSvg();rMapSel();rBiz()}

/* Массовое открытие кейсов */
function openMany(cs,n){
  if(busy||!cs)return;n=Math.min(n,100,S.cases[cs.id]||0);if(n<1)return;
  S.cases[cs.id]-=n;sfx("init");$("rw").style.display="none";
  const got=[];let gems=0;
  for(let i=0;i<n;i++){const w=roll(cs),it={c:w.c,g:w.g,id:nid()};S.inv.push(it);got.push(it);if(Math.random()<.2)gems+=1+rn(2)}
  S.gem+=gems;
  const tot=got.reduce((s,c)=>s+val(c),0),cost=cprice(cs)*n,best=got.reduce((m,c)=>val(c)>val(m)?c:m),bt=tier(val(best));
  const sorted=got.slice().sort((a,b)=>val(b)-val(a));
  sfx("win",bt);winFx(bt);
  $("res").innerHTML=`<div class="mres"><div class="sum">${tt("Открыто:")} <b>${n} × ${esc(cs.n)}</b><br>${tt("Выпало на")} <b>${fmt(tot)} $</b>${cs.gem?"":` · ${tt("цена кейсов")} ${fmt(cost)} $ · <span class="${tot>=cost?"good":"bad"}">${tot>=cost?"+":""}${fmt(tot-cost)} $</span>`}${gems?`<br><span class="good">+${gems} 💎</span>`:""}</div>
<div>${tt("Лучшая:")} <b>${esc(CARDS[best.c].n)}</b> · ${fmt(val(best))} $</div>
<div class="grid">${sorted.map(cardHTML).join("")}</div>
<button class="btn alt" id="sellAll">${tt("Продать всё за")} ${fmt(got.reduce((s,c)=>s+Math.floor(val(c)*sellRate()),0))} $</button></div>`;
  $("sellAll").onclick=()=>{let t=0;for(const it of got){const i=S.inv.findIndex(x=>x.id===it.id);if(i>=0){S.inv.splice(i,1);t+=Math.floor(val(it)*sellRate())}}
    S.bal+=t;sfx("coin");$("res").innerHTML=tt("Продано {0} карт за {1} $ ✅",got.length,fmt(t));upd();rInv();rProf()};
  upd();rInv();
}

/* Апгрейдер */
const ALLV=(()=>{const a=[];CARDS.forEach((k,c)=>BGS.forEach((b,g)=>a.push({c,g,v:k.p+b.b})));return a.sort((x,y)=>x.v-y.v)})();
let UPSEL=0,UPCH=70,upBusy=false;
const upMult=ch=>1+(100-ch)/100,upTarget=(P,ch)=>Math.round(P*upMult(ch));
function upResult(P,ch){const t=upTarget(P,ch);let lo=0,hi=ALLV.length-1;while(lo<hi){const m=(lo+hi)>>1;if(ALLV[m].v<t)lo=m+1;else hi=m}
  let i=lo;if(i>0&&Math.abs(ALLV[i-1].v-t)<Math.abs(ALLV[i].v-t))i--;
  while(i<ALLV.length-1&&ALLV[i].v<=P)i++;
  const c=ALLV[i].v,ok=[];for(let j=Math.max(0,i-60);j<Math.min(ALLV.length,i+60);j++){const v=ALLV[j].v;if(v>P&&Math.abs(v-c)<=Math.max(30,c*.03))ok.push(ALLV[j])}
  return ok.length?ok[rn(ok.length)]:ALLV[i]}
const upCard=()=>S.inv.find(x=>x.id===UPSEL);
function rUp(){if(!upCard())UPSEL=0;
  $("upGrid").innerHTML=S.inv.slice().sort((a,b)=>val(b)-val(a)).map(c=>`<div class="item ${c.id===UPSEL?"pick2":""}" data-a="upsel" data-v="${c.id}">${cardHTML(c)}</div>`).join("")||`<span class="hint">${tt("Нет карточек")}</span>`;
  rUpInfo()}
function rUpInfo(){const c=upCard(),ch=UPCH;$("upWheel").style.setProperty("--p",ch);$("upChv").textContent=ch+"%";$("upMid").textContent=ch+"%";
  if(!c){$("upFrom").innerHTML=tt("Выбери карту ниже");$("upTo").textContent="—";$("upInfo").textContent="";$("upGo").disabled=true;return}
  const P=val(c),t=upTarget(P,ch),ev=Math.round(ch*upMult(ch));
  $("upFrom").innerHTML=cardHTML(c);$("upTo").innerHTML=`<div style="font-size:12px;color:var(--muted)">${tt("цель ≈")}</div><div style="font-family:var(--fd);font-size:15px;color:var(--text)">${fmt(t)} $</div><div style="font-size:12px;color:var(--ok)">×${upMult(ch).toFixed(2)}</div>`;
  $("upInfo").innerHTML=`${tt("Шанс")} <b>${ch}%</b> · ${tt("прирост")} <b>+${100-ch}%</b>`;$("upGo").disabled=upBusy}
BA.upsel=id=>{if(upBusy)return;UPSEL=id;$("upRes").innerHTML="";rUp()};
document.addEventListener("input",e=>{if(e.target.id==="upCh"){UPCH=+e.target.value;rUpInfo()}});
BA.upgo=()=>{const c=upCard();if(!c||upBusy)return;upBusy=true;$("upGo").disabled=true;
  const P=val(c),ch=UPCH,win=Math.random()*100<ch,res=win?upResult(P,ch):null,ang=ch*3.6,m=6;
  const a=win?m+rnd(ang*.08,ang*.92):ang+m+rnd(0,360-ang-2*m);
  S.inv=S.inv.filter(x=>x.id!==c.id);S.prof.show=S.prof.show.filter(id=>id!==c.id);
  let nit=null;if(win){nit={c:res.c,g:res.g,id:nid()};S.inv.push(nit);UPSEL=nit.id}else UPSEL=0;
  save();
  const nd=$("upNeedle");nd.style.transition="none";nd.style.transform="rotate(0deg)";void nd.offsetWidth;
  nd.style.transition="transform 3.2s cubic-bezier(.15,.7,.1,1)";nd.style.transform=`rotate(${360*4+a}deg)`;
  sfx("init");for(let i=1;i<=24;i++)setTimeout(()=>sfx("tick"),3200*(1-Math.pow(1-i/24,1/3)));
  setTimeout(()=>{upBusy=false;
    if(win){const tr=tier(val(nit));sfx("win",tr);winFx(tr);$("upRes").innerHTML=`<div class="good" style="font-size:18px;font-weight:800">${tt("Успех!")} ${fmt(P)} → ${fmt(val(nit))} $</div>${cardHTML(nit)}`}
    else{sfx("coin");$("upRes").innerHTML=`<div class="bad" style="font-size:18px;font-weight:800">${tt("Неудача 💥 карта сгорела")}</div>${cardHTML(c)}`}
    upd();rInv();rProf();rUp()},3300)};

/* Навигация и события */
function tab(v){
  cur=v;
  document.querySelectorAll(".dp .tb").forEach(x=>x.classList.toggle("on",x.dataset.v===v));
  document.querySelectorAll(".sec").forEach(x=>x.classList.toggle("on",x.id===v));
  $("drawer").classList.remove("on");window.scrollTo(0,0);
  if(v==="inv"){rInv();rOwn();itab(invTab)}if(v==="mk"){rMarket();pollMarket()}if(v==="map")rMap();if(v==="up")rUp();if(v==="prof"){rProf();pollIn()}if(v==="st"){rSt();pullStocks()}if(v==="trd"){rTrade();pollIn()}}
document.addEventListener("click",e=>{
  if(e.target.closest("#mbtn")){$("drawer").classList.toggle("on");return}
  if(e.target===$("drawer")){$("drawer").classList.remove("on");return}
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  if(a==="tab")tab(v);else if(a==="case")openCase(CASES[+v]);else if(a==="sell")sell(+v);
  else if(a==="list")openList(+v);else if(a==="doList")doList(+v);else if(a==="close")closeM();
  else if(a==="unlist")unlist(v);else if(a==="buy")buy(v);else if(a==="av")setAv(v);else if(a==="show")toggleShow(+v);else if(a==="trade")trade(v);
  else if(a==="tsend")sendOffer();else if(a==="tacc")accOffer(v);else if(a==="tdec")decOffer(v);else if(a==="tcan")cancelOut(v);
  else if(a==="lang")setLang(v);else if(a==="copyid")copyId();
  else if(a==="bc"){const[i,n]=v.split("|");buyCase(+i,+n)}else if(a==="gx")gx(+v);else if(a==="promo")promo();else if(a==="itab")itab(v);else if(a==="newst")openNewSt();else if(a==="mkst")createStock();else if(a==="topup")topup(v);else if(a==="mopen"){const[i,n]=v.split("|");openMany(CASES[+i],+n)}else if(BA[a])BA[a](+v)});
$("reset").onclick=()=>{if(busy||!confirm(tt("Сбросить весь прогресс?")))return;const k=S.codes,u=S.uid,lg=S.lang;S=def();S.codes=k;S.uid=u;S.lang=lg;mkSync();upd();rInv();rMarket();rProf();toast(tt("Прогресс сброшен"))};

/* Старт */
load();
document.documentElement.lang=LANG;document.title=LANG==="en"?"$ Cases":"$ Кейсы";
document.querySelectorAll("[data-t]").forEach(e=>{e.textContent=tt(e.dataset.t)});
document.querySelectorAll("[data-tp]").forEach(e=>{e.placeholder=tt(e.dataset.tp)});
$("lru").classList.toggle("alt",LANG!=="ru");$("len").classList.toggle("alt",LANG!=="en");
mkSync();checkGifts();const tax0=taxTick();bizTick();
upd();rInv();rMarket();rProf();
if(tax0>0)setTimeout(()=>toast(tt("Налог на богатство: −{0} $",fmt(tax0))),1500);
/* Онлайн: обмен между игроками по ID */
let lastSend=0;
const okId=x=>/^[a-z0-9]{6,20}$/i.test(x);
async function db(p,m,b){const[a,q]=p.split("?");const r=await fetch(`${DB_URL}/${a}.json${q?"?"+q:""}`,{method:m||"GET",body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw 0;return r.json()}
async function detectDb(){const c=["https://kxgame-default-rtdb.firebaseio.com","https://kxgame-default-rtdb.europe-west1.firebasedatabase.app","https://kxgame-default-rtdb.asia-southeast1.firebasedatabase.app"];
  const res=await Promise.all(c.map(u=>fetch(u+"/.json?shallow=true",{signal:AbortSignal.timeout(5000)}).then(r=>r.status).catch(()=>0)));
  const i=res.findIndex(x=>x&&x!==404);if(i>=0)DB_URL=c[i];else toast(tt("Онлайн недоступен: проверь URL базы"))}
function rBdg(){const n=Object.keys(IN).length;for(const id of["bdg","bdg2"]){const b=$(id);b.hidden=!n;b.textContent=n}}
function rTrade(){const sel=$("tsel"),v=sel.value;
  sel.innerHTML=S.inv.length?S.inv.slice().sort((a,b)=>val(b)-val(a)).map(c=>`<option value="${c.id}">${CARDS[c.c].i} ${CARDS[c.c].n} · ${BGS[c.g].n} · ${fmt(val(c))}</option>`).join(""):`<option value="">${tt("Нет карточек")}</option>`;
  if(v)sel.value=v;rOffers()}
async function sendOffer(){const to=$("tid").value.trim(),id=+$("tsel").value,pk=Math.min(1e9,Math.max(0,Math.round(+$("tpr").value||0))),i=S.inv.findIndex(x=>x.id===id);
  if(!DB_URL){toast(tt("Онлайн недоступен"));return}
  if(!okId(to)){toast(tt("Введи корректный ID игрока"));return}
  if(to===S.uid){toast(tt("Нельзя обмениваться с собой"));return}
  if(i<0){toast(tt("Выбери карточку"));return}
  if(S.out.length>=5){toast(tt("Максимум 5 открытых предложений"));return}
  if(lastSend)return;lastSend=1;const c=S.inv[i];
  try{const r=await db(`inbox/${to}`,"POST",{t:"offer",f:S.uid,fn:String(S.prof.nick).slice(0,16),fa:S.prof.av,gc:{c:c.c,g:c.g},pk,ts:Date.now()});
    const j=S.inv.findIndex(x=>x.id===id);if(j>=0)S.inv.splice(j,1);
    S.out.push({k:r.name,to,tn:to,c:{c:c.c,g:c.g},pk});$("tid").value="";$("tpr").value="";toast(tt("Приглашение отправлено"));upd();rInv();rProf();rTrade()}
  catch(e){toast(tt("Нет связи 😕"))}lastSend=0}
async function pollIn(){if(!DB_URL||inBusy)return;inBusy=1;
  try{const d=await db(`inbox/${S.uid}`)||{};const old=IN;IN={};let ch=0,nw=0;
    for(const[k,m]of Object.entries(d)){if(!m||typeof m!=="object")continue;
      if(m.t==="offer"){const c=safeCard(m.gc);if(c&&okId(m.f)){IN[k]={k,f:m.f,fn:String(m.fn||"Игрок").slice(0,16),fa:safeAv(m.fa),c,pk:Math.min(Math.max(0,+m.pk||0),1e9)};if(!old[k])nw=1}continue}
      if(!S.seen.includes(k)){const c=safeCard(m.gc),a=Math.min(Math.max(0,+m.kx||0),1e9),nm=String(m.fn||"Игрок").slice(0,16);
        if(m.t==="acc"){S.bal+=a;toast(tt("{0} принял предложение: +{1} $",nm,fmt(a)))}
        else if(m.t==="sold"){S.bal+=a;S.list=S.list.filter(x=>x.id!==m.lk);toast(tt("{0} купил твою карточку: +{1} $",nm,fmt(a)))}
        else if(m.t==="ret"){if(c)S.inv.push({c:c.c,g:c.g,id:nid()});toast(tt("Предложение отклонено, карточка вернулась"))}
        S.out=S.out.filter(x=>x.k!==m.ok);S.seen=S.seen.slice(-80).concat(k);ch=1}
      await db(`inbox/${S.uid}/${k}`,"DELETE")}
    if(nw)toast(tt("Новое приглашение на обмен 🔁"));
    if(ch){upd();rInv();rProf();rMarket();if(cur==="trd")rTrade()}rOffers();rBdg()}catch(e){}inBusy=0}
function rOffers(){const ks=Object.keys(IN);
  $("offers").innerHTML=ks.length?`<h3>${tt("Приглашения на обмен")}</h3>`+ks.map(k=>{const o=IN[k];return `<div class="stk"><div class="top"><span>${avHTML(o.fa,28)} <b>${esc(o.fn)}</b> ${tt("предлагает карточку:")}</span></div><div class="show" style="justify-content:center;margin:8px 0">${cardHTML(o.c)}</div><div class="row"><button class="btn" data-a="tacc" data-v="${k}" ${S.bal<o.pk?"disabled":""}>${o.pk?tt("Купить за {0} $",fmt(o.pk)):tt("Взять даром")}</button><button class="btn alt" data-a="tdec" data-v="${k}">${tt("Отклонить")}</button></div></div>`}).join(""):"";
  $("outs").innerHTML=S.out.length?`<h3>${tt("Мои предложения")}</h3>`+S.out.map(o=>`<div class="stk"><div class="top"><span>${CARDS[o.c.c].i} ${CARDS[o.c.c].n} → <b>${esc(o.tn||"")}</b> · ${o.pk?fmt(o.pk)+" $":tt("подарок")}</span><button class="btn alt sm" data-a="tcan" data-v="${o.k}">${tt("Отозвать")}</button></div></div>`).join(""):""}
async function accOffer(k){const o=IN[k];if(!o)return;if(S.bal<o.pk){toast(tt("Не хватает $ 😕"));return}
  try{if(!await db(`inbox/${S.uid}/${k}`)){toast(tt("Предложение уже отозвано"));delete IN[k];rOffers();rBdg();return}
    await db(`inbox/${S.uid}/${k}`,"DELETE");S.bal-=o.pk;S.inv.push({c:o.c.c,g:o.c.g,id:nid()});delete IN[k];
    await db(`inbox/${o.f}`,"POST",{t:"acc",ok:k,kx:Math.round(o.pk*FEE),fn:String(S.prof.nick).slice(0,16),ts:Date.now()});
    toast(tt("Получено: {0}",CARDS[o.c.c].n));upd();rInv();rProf();rOffers();rBdg()}catch(e){toast(tt("Нет связи 😕"))}}
async function decOffer(k){const o=IN[k];if(!o)return;
  try{await db(`inbox/${S.uid}/${k}`,"DELETE");await db(`inbox/${o.f}`,"POST",{t:"ret",ok:k,gc:{c:o.c.c,g:o.c.g},ts:Date.now()});delete IN[k];rOffers();rBdg()}catch(e){toast(tt("Нет связи 😕"))}}
async function cancelOut(k){const o=S.out.find(x=>x.k===k);if(!o)return;
  try{if(!await db(`inbox/${o.to}/${k}`)){toast(tt("Уже обработано, жди ответ"));return}await db(`inbox/${o.to}/${k}`,"DELETE");
    S.out=S.out.filter(x=>x!==o);S.inv.push({c:o.c.c,g:o.c.g,id:nid()});upd();rInv();rProf();rTrade()}catch(e){toast(tt("Нет связи 😕"))}}
function setLang(v){if(v!=="ru"&&v!=="en")return;S.lang=v;save();location.reload()}
function copyId(){const f=()=>toast(tt("ID скопирован"));try{navigator.clipboard.writeText(S.uid).then(f,()=>toast(S.uid))}catch(e){toast(S.uid)}}
detectDb().then(()=>{pollIn();pollMarket();pullStocks()});
setInterval(tick,1000);
</script>
