<html lang="ru">

<title>Card Rush</title>
<meta name="application-name" content="Card Rush"><meta name="apple-mobile-web-app-title" content="Card Rush"><meta name="theme-color" content="#0b0b12"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800&family=Russo+One&family=Nunito:wght@500;600;700;800&family=Comfortaa:wght@600;700&family=Inter:wght@500;600;700;800&family=Oswald:wght@500;600;700&family=Lora:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Tektur:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Card Rush · дизайн v4 «Аркада»: объёмные плитки-слэбы, кнопки-клавиши, плоский нижний бар, живое движение */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark;
--bg:#0b0b0e;--panel:#151519;--p2:#1e1e24;--line:#2d2d35;--slab:#050507;--text:#f3f3f6;--muted:#8d8d99;--ok:#35e8a0;--bad:#ff5a78;
--accent:#d8dae2;--accent2:#9a9fb3;--on:#0a0a0a;--r:18px;--rs:12px;--key:color-mix(in srgb,var(--accent) 52%,#000);
--sea:#0c0d12;--land:#26272f;--lands:#5a5c6e;--fd:"Unbounded","Manrope",system-ui,sans-serif;--fb:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme="light"]{color-scheme:light;--bg:#eeeef1;--panel:#fff;--p2:#f4f4f7;--line:#d0d0d8;--slab:#d6d6de;--text:#16161c;--muted:#6c6c7a;--ok:#0b9f66;--bad:#dc2f4d;--sea:#e4e5ec;--land:#fff;--lands:#a4a6b8}
@media (prefers-color-scheme:light){:root:not([data-theme]){color-scheme:light;--bg:#eeeef1;--panel:#fff;--p2:#f4f4f7;--line:#d0d0d8;--slab:#d6d6de;--text:#16161c;--muted:#6c6c7a;--ok:#0b9f66;--bad:#dc2f4d;--sea:#e4e5ec;--land:#fff;--lands:#a4a6b8}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
[hidden]{display:none!important}
body{margin:0 auto;max-width:880px;min-height:100vh;padding:0 16px calc(104px + env(safe-area-inset-bottom,0px));background:transparent;color:var(--text);font:600 15px/1.4 var(--fb);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(color-mix(in srgb,var(--line) 70%,transparent) 1.3px,transparent 1.6px) 0 0/22px 22px,var(--bgfx,linear-gradient(transparent,transparent)),var(--bg);-webkit-mask-image:linear-gradient(#000 20%,rgba(0,0,0,.45));mask-image:linear-gradient(#000 20%,rgba(0,0,0,.45))}
button,[data-a]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (min-width:1024px){body{padding-bottom:40px}.dock{display:none!important}}

/* ---------- шапка ---------- */
header{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:10px;margin:0 -16px 18px;padding:10px 16px;background:var(--panel);border-bottom:2px solid var(--line)}
.menu{position:relative;flex:none;width:44px;height:44px;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;padding:0;border-radius:var(--rs);border:2px solid var(--line);background:var(--p2);box-shadow:0 3px 0 var(--slab);cursor:pointer;transition:transform .1s,box-shadow .1s}
.menu:active{transform:translateY(3px);box-shadow:0 0 0 var(--slab)}
.hl{display:block;width:18px;height:2.5px;border-radius:2px;background:var(--text)}.menu .bdg{position:absolute;top:-7px;right:-7px}
.me{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:800 15px var(--fb)}
.mn{display:flex;flex-direction:column;min-width:0;line-height:1.25}.mn small{font-size:11px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bal{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding:6px 12px;border-radius:var(--rs);background:var(--p2);border:2px solid var(--line);box-shadow:0 3px 0 var(--slab);font:800 14px/1.2 var(--fb);white-space:nowrap}
.bal span:last-child{font-size:12px;color:var(--muted)}#bal,#gem{display:inline}
.avt{display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;line-height:1;border-radius:50%;color:#fff;text-shadow:0 1px 3px #0008;box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.avt.fr-g{box-shadow:0 0 0 2px var(--panel),0 0 0 5px #ffc83d}.avt.fr-v{box-shadow:0 0 0 2px var(--panel),0 0 0 5px #8a3dff}.avt.fr-r{box-shadow:0 0 0 2px var(--panel),0 0 0 5px #ff5cc8;animation:ringHue 4s linear infinite}
.avs{display:flex;gap:12px;overflow-x:auto;padding:8px 8px 12px}.avs .avt{cursor:pointer;transition:transform .15s}.avs .avt:active{transform:scale(.92)}.avs>span.sel .avt{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--accent)}
.nwd{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;animation:glow 2s infinite}
.bdg{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;font-weight:800;padding:1px 6px}

/* ---------- навигация ---------- */
nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:2px 16px 8px}nav::-webkit-scrollbar{display:none}
nav button{flex:none;white-space:nowrap;padding:10px 16px;border-radius:var(--rs);border:2px solid var(--line);background:var(--p2);color:var(--muted);font:800 13px var(--fb);box-shadow:0 3px 0 var(--slab);cursor:pointer;transition:transform .1s,box-shadow .1s,background .15s,color .15s}
nav button:active{transform:translateY(3px);box-shadow:none}nav button.on{background:var(--accent);border-color:var(--key);color:var(--on);box-shadow:0 3px 0 var(--key)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;padding:0 6px env(safe-area-inset-bottom,0px);background:var(--panel);border-top:2px solid var(--line)}
.dk{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 0 9px;border:0;background:none;color:var(--muted);font:inherit;font-size:22px;line-height:1;cursor:pointer;transition:color .15s}
.dk span{font-size:10px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk::before{content:"";position:absolute;left:22%;right:22%;top:-2px;height:4px;border-radius:0 0 4px 4px;background:var(--accent);transform:scaleX(0);transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.dk.on{color:var(--text)}.dk.on::before{transform:scaleX(1)}.dk.on{animation:dkPop .32s}
.sec{display:none}.sec.on{display:block;animation:secIn .2s ease-out}
h3{display:flex;align-items:center;gap:10px;margin:28px 2px 12px;font:800 15px var(--fd)}h3::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--line)}

/* ---------- кнопки и поля ---------- */
.btn{padding:12px 16px;border:2px solid var(--key);border-radius:14px;background:var(--accent);color:var(--on);font:800 14px var(--fb);box-shadow:0 4px 0 var(--key);cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--key)}.btn:disabled{opacity:.38;cursor:default;box-shadow:0 4px 0 var(--key);filter:grayscale(.5)}
.btn.alt{background:var(--p2);color:var(--text);border-color:var(--line);box-shadow:0 4px 0 var(--slab)}.btn.alt:active:not(:disabled){box-shadow:0 0 0 var(--slab)}.btn.alt:disabled{box-shadow:0 4px 0 var(--slab)}
.btn.sm{padding:8px 10px;font-size:12px;box-shadow:0 3px 0 var(--key)}.btn.alt.sm{box-shadow:0 3px 0 var(--slab)}
input,select,.fld{font:700 16px var(--fb);color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:12px!important;padding:11px 12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
input[type=range]{padding:0;accent-color:var(--accent);background:none;border:0}input[type=range]:focus{box-shadow:none}input[type=checkbox]{accent-color:var(--accent)}
.fld{width:100%;margin-bottom:8px}.chrow{display:flex;gap:8px;margin-top:8px}.chrow input{flex:1;min-width:0}
.r2{display:flex;gap:8px;padding-bottom:4px}.r2 .btn{flex:1;padding:10px 4px;font-size:13px}.row{display:flex;gap:8px;padding-bottom:4px}
.hint{margin:0 0 10px;color:var(--muted);font-size:13px;font-weight:600;line-height:1.45}.good{color:var(--ok)}.bad{color:var(--bad)}.foot{text-align:center;padding:14px 0 24px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:5px 12px;border-radius:10px;background:var(--p2);border:2px solid var(--line);font-size:13px;font-weight:800}
.qk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}.qk .btn{display:flex;align-items:center;justify-content:center;gap:8px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}

/* ---------- панели ---------- */
.case,.pf,.rw,.chbox,.ev,.mb,.upbox,.rst,.fbtn,.bbtn,.mod,.stk{background:var(--panel);border:2px solid var(--line);border-radius:var(--r);box-shadow:0 5px 0 var(--slab)}
.sdw,.lr{background:var(--panel);border:2px solid var(--line);border-radius:14px}.lr{box-shadow:0 3px 0 var(--slab)}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px;margin-bottom:16px}
.case{padding:18px 12px 16px;text-align:center;transition:transform .18s cubic-bezier(.3,1.4,.5,1),border-color .15s}
.case .big{display:inline-block;font-size:50px;line-height:1.1;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.case b{font:800 12px var(--fd)}.case small{display:block;margin:6px 0 10px;color:var(--muted);font-size:13px}.case s{color:var(--muted);font-size:12px}
.case .r2{margin-top:8px}.case .r2:empty{display:none}
.ev{padding:14px 16px;margin-bottom:14px;border-color:var(--accent);font-size:14px;position:relative;overflow:hidden}
.pf{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:18px}.pf input{width:100%;max-width:260px}
.lb{display:flex;flex-direction:column;gap:10px}.lr{display:flex;align-items:center;gap:12px;padding:10px 14px}
.lr.me{border-color:var(--accent)}.lr .rk{width:30px;font:800 13px var(--fd);color:var(--muted)}.lr .nn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chbox{height:45vh;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}.msg{display:flex;gap:8px;font-size:14px;word-break:break-word}.msg small{color:var(--muted)}.msg b{cursor:pointer;font-weight:800}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:16px}.mod{padding:14px;display:flex;flex-direction:column;gap:6px}.mod b{display:flex;gap:8px;align-items:center}.mod small{color:var(--muted);line-height:1.3}.mod.on{border-color:var(--accent)}.mod .tm{font-weight:800;color:var(--accent)}
.nb{border-color:var(--ok)}.nbar{height:10px;border-radius:8px;background:var(--bg);border:2px solid var(--line);overflow:hidden;margin-top:8px}.nbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--accent2),var(--ok));background-size:200% 100%;animation:shine 2.4s linear infinite}
.fbtn,.bbtn{display:flex;flex-direction:column;gap:6px;text-align:left;padding:12px 14px;color:var(--text);font:inherit;cursor:pointer;transition:transform .1s,box-shadow .1s}.fbtn:active,.bbtn:active{transform:translateY(4px);box-shadow:none}
.fbtn b{font-size:14px}.fbtn span{font-size:13px;color:var(--muted)}.fbtn.on,.bbtn.on{border-color:var(--accent)}.bbtn b{font-size:13px}.bbtn .pv{display:block;height:44px;border-radius:10px;border:2px solid var(--line)}
.sw{display:flex;flex-wrap:wrap;gap:12px}.sw button{width:42px;height:42px;padding:0;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:transform .15s}.sw button:active{transform:scale(.9)}.sw button.on{border-color:var(--text)}
#acPick{width:56px;height:42px;padding:0;border-radius:10px}
.idrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;flex-wrap:wrap}.idrow b{font:800 12px var(--fd);word-break:break-all}
#offers:empty{display:none}.ttl{flex:1 1 100%;display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:2px dashed var(--line)}
.tchips{display:flex;flex-wrap:wrap;gap:8px}.tc{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;font-weight:800;font-size:13px;border:2px solid var(--line);background:var(--p2);overflow-wrap:anywhere}.tc.big{font-size:15px;padding:9px 16px;border-color:var(--accent);color:var(--accent)}
.tsub{font-size:12px;color:var(--muted);font-weight:700}.tpg{height:10px;border-radius:8px;background:var(--bg);border:2px solid var(--line);overflow:hidden}.tpg i{display:block;height:100%;min-width:4px;background:var(--accent);transition:width .6s}
.tl{display:flex;align-items:center;gap:10px;min-width:0}.tm{font-style:normal;width:34px;text-align:center;font-weight:800;flex:none}.tn{display:flex;flex-direction:column;min-width:0}.tn b,.tn small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tn small{font-size:11px;color:var(--muted)}.tv{flex:none}
.tr .top{align-items:center}.tr.p1{border-color:#ffc83d}.tr.p2{border-color:#c9cde0}.tr.p3{border-color:#d98b52}

/* ---------- карточки ---------- */
.card{position:relative;flex:none;width:112px;overflow:hidden;padding:12px 6px;border-radius:18px;border:2px solid #8a90a3;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #000a;box-shadow:0 8px 18px -8px #000b}
.card .ic{font-size:38px;line-height:1.15}.card .nm{font:600 10px var(--fd)}.card .bgn{min-height:14px;font-size:11px;opacity:.9}.card .pr{margin-top:4px;font:600 10px var(--fd)}
.cdt{position:absolute;top:4px;right:4px;z-index:2;padding:1px 5px;border-radius:6px;color:#0a0a0a;font-size:9px;font-weight:800;line-height:1.3;text-shadow:none}
.t1{border-color:#9aa0b0}.t2{border-color:#4aa3ff}.t3{border-color:#a566ff}.t4{border-color:#ff5cc8}.t5{border-color:#ffc83d;box-shadow:0 0 18px #ffc83d88}
.t6{border-color:#fff;box-shadow:0 0 16px #ff5cc8aa,0 0 26px #5cc8ff88;animation:holo 3s linear infinite}
.t7{border-color:#fff!important;box-shadow:0 0 18px #fff9,0 0 42px #ff5cc8aa!important;animation:holo 2s linear infinite!important}
.rtag{position:absolute;top:-1px;left:50%;transform:translateX(-50%);padding:1px 6px;border-radius:0 0 8px 8px;background:linear-gradient(90deg,#ff5cc8,#ffc83d,#5cc8ff);color:#111;font-size:8px;font-weight:800;white-space:nowrap;text-shadow:none}
.rw{position:relative;overflow:hidden;padding:16px 0;min-height:190px}.rw::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--accent);transform:translateX(-50%);z-index:2}
.strip{display:flex;gap:8px;will-change:transform}
.res{min-height:20px;margin-top:14px;text-align:center;font-weight:700}.res .card{width:150px;margin:0 auto 8px;animation:pop .45s}.cres{min-height:28px;margin-top:8px;text-align:center;font-size:20px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}.grid .card{width:auto}.grid .item{content-visibility:auto;contain-intrinsic-size:auto 170px}
.item{display:flex;flex-direction:column;gap:6px;cursor:pointer}.item .row .btn{flex:1}.item.pick .card{outline:3px solid var(--ok);outline-offset:2px}.item.pick2 .card{outline:3px solid var(--accent2);outline-offset:2px}
.mk .sub,.pk .sub{font-size:12px;text-align:center;color:var(--muted);font-weight:700}
.show{display:flex;gap:6px;flex-wrap:wrap}.show .card{width:86px;padding:6px 2px}.show .card .ic{font-size:26px}.show .card .nm{font-size:9px}.show .card .bgn{display:none}.show .card .pr{font-size:9px}
.set.rdy{animation:glow 2s infinite}.set .dim{opacity:.3;filter:grayscale(1)}
.cc{position:relative;overflow:hidden;aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:space-between;padding:12px 6px;border-radius:18px;border:2px solid #fff9;text-align:center;color:#fff;text-shadow:0 1px 4px #000b;cursor:pointer}
.cc>*{position:relative}.ccs{position:absolute!important;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,#fff5 48%,transparent 66%);background-size:250% 100%;animation:ccsh 3.5s linear infinite}
.cci{font-size:46px}.cct{font:700 11px var(--fd)}.ccn{font-weight:800;font-size:14px}.ccid{font-size:9px;opacity:.9;word-break:break-all;font-weight:700}
.bg-holo{background-image:linear-gradient(135deg,#ff5cc8,#ffc83d,#5cffb0,#5cc8ff,#a566ff,#ff5cc8)}.bg-glit{background-image:repeating-linear-gradient(0deg,#00ffa633 0 2px,transparent 2px 4px),linear-gradient(135deg,#120028,#00ffa6,#ff00aa,#120028)}.bg-lava{background-image:radial-gradient(circle at 30% 100%,#ffd000,#ff4500 35%,#3b0a00 75%)}.bg-crys{background-image:conic-gradient(from 0deg,#99bbff,#fff,#66eeff,#cc99ff,#99bbff)}.bg-gala{background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 60%,#fff,transparent),radial-gradient(2px 2px at 40% 80%,#fff,transparent),linear-gradient(160deg,#0b0033,#4b1d9a,#ff3d81)}.bg-void{background-image:radial-gradient(circle at 50% 50%,#000 0 22%,#ff9a3d 30%,#3b1d6e 55%,#000 82%)}.bg-gold{color:#3a2600;text-shadow:0 1px 2px #fff8;background-image:linear-gradient(135deg,#7a5200,#ffd86b,#fff2b0,#d29a1b,#7a5200)}.bg-arca{background-image:linear-gradient(120deg,#00ffd5,#7a5cff,#ff4fd8,#00ffd5)}.bg-prim{background-image:conic-gradient(from 0deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);border-color:#fff}.bg-sakura{background-image:linear-gradient(135deg,#ffd1e3,#ff8fb8,#ffe3ee,#ff8fb8)}.bg-ice{background-image:linear-gradient(160deg,#e6fbff,#7fd7ff,#fff,#4aa8ff)}.bg-toxic{background-image:repeating-linear-gradient(45deg,#111 0 10px,#b6ff00 10px 20px)}.bg-storm{background-image:linear-gradient(180deg,#1b1f3a,#3a4a8a,#fff6a0,#1b1f3a)}.bg-auro{background-image:linear-gradient(120deg,#021a2b,#00ff95,#6a5cff,#ff5ce1,#021a2b)}.bg-abys{background-image:radial-gradient(circle at 50% 120%,#00e0ff,#0b3d91 40%,#000814 80%)}.bg-dia{color:#123;text-shadow:0 1px 2px #fff9;background-image:conic-gradient(from 45deg,#fff,#a8ecff,#fff,#d6c8ff,#fff,#a8ecff,#fff)}.bg-kings{background-image:linear-gradient(135deg,#3b0a5a,#b01fff,#ffd400,#3b0a5a)}

/* ---------- окна ---------- */
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:#05060fc8}.modal.on{display:flex}
.mb{display:flex;flex-direction:column;gap:12px;align-items:center;width:90%;max-width:340px;padding:22px;text-align:center;box-shadow:0 24px 60px #000b}
.mb .card{width:140px}.mb input,.mb select{width:100%}
.insp{max-width:340px;max-height:92vh;overflow:auto}.insp .card,.insp .cc{width:210px;margin:0 auto;padding:18px 8px}.insp .card .ic{font-size:76px}.insp .card .nm{font-size:13px}.insp .card .cdt{font-size:12px;padding:2px 7px}
.idesc{display:flex;flex-direction:column;gap:6px;font-size:14px;width:100%}.idesc>div{display:flex;justify-content:space-between;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}.idesc span{color:var(--muted)}.idesc .hint{display:block;border:0;margin:0}
