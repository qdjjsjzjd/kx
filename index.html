.lb{display:flex;flex-direction:column;gap:6px}

.bal{padding:7px 10px;font-size:13px}.r2{display:flex;gap:5px}.r2 .btn{flex:1;padding:8px 4px;font-size:13px}.ev{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}.case s{color:var(--muted);font-size:12px}

/* ===== Тема: неон + стекло ===== */
:root{--bg:#0a0b14;--panel:#141627;--line:#262a45;--text:#f1f3ff;--muted:#8f95b8;--ok:#34e0a1;--bad:#ff5d7a;--r:18px;--sh:0 10px 30px #0007;--sea:#080b1d;--land:#2c3568;--lands:#5a66b8;--fd:"Unbounded","Manrope",system-ui,sans-serif;--fb:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

body{font-family:var(--fb);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.005em;background:radial-gradient(900px 520px at 8% -8%,color-mix(in srgb,var(--accent) 19%,transparent),transparent 60%),radial-gradient(800px 520px at 100% 0,color-mix(in srgb,var(--accent2) 12%,transparent),transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
header{position:sticky;top:0;z-index:8;margin:-12px -12px 12px;padding:10px 12px;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.me span{font-family:var(--fd);font-size:13px;font-weight:600}
.avt{border:2px solid transparent;background-clip:padding-box;box-shadow:0 0 0 2px var(--accent),0 4px 14px #0005}
.bal{font-family:var(--fd);font-size:11px;font-weight:600;padding:8px 12px;border-radius:999px;background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box;border:1px solid transparent}
nav{scrollbar-width:none;padding:6px 4px 14px;margin:-6px -4px 0}nav::-webkit-scrollbar{display:none}

.hint{line-height:1.45}

.ev{border:1px solid transparent;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,transparent),color-mix(in srgb,var(--accent2) 10%,transparent)) padding-box,linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box}
.case{transition:.2s;padding:16px 12px}.case:hover{transform:translateY(-3px);border-color:var(--accent)}
.case .big{font-size:46px;filter:drop-shadow(0 6px 14px color-mix(in srgb,var(--accent) 40%,transparent))}

input,select{font-family:var(--fb);font-weight:600;border-radius:12px!important;transition:border-color .15s,box-shadow .15s}

.chip{font-weight:700;background:color-mix(in srgb,var(--panel) 80%,var(--line))}

.card{position:relative;overflow:hidden;border-radius:16px;border-width:2px;box-shadow:0 6px 16px #0006;font-weight:700}

.t1{border-color:#9aa0b0}.t2{border-color:#4aa3ff;box-shadow:0 6px 18px #4aa3ff33}.t3{border-color:#a566ff;box-shadow:0 6px 20px #a566ff44}

:root{--accent:#c6ff00;--accent2:#00e5ff;--on:#0a0a0a;--ok:#19f58f;--bad:#ff3358;--r:10px;--text:#f6f6fb;--muted:#9494a8;

--grad:linear-gradient(135deg,var(--accent),var(--accent2));--sh:0 8px 24px #000a}
@media (prefers-color-scheme:light){:root:not([data-theme]){--bg:color-mix(in srgb,var(--accent) 6%,#f7f7fb);--panel:#fff;--line:color-mix(in srgb,var(--accent) 25%,#dcdce8);--text:#101018;--muted:#62627a;--ok:#0a9f63;--bad:#e0173f;--sh:0 8px 22px #1a1a4a22}}
:root[data-theme="light"]{color-scheme:light;--bg:color-mix(in srgb,var(--accent) 6%,#f7f7fb);--panel:#fff;--line:color-mix(in srgb,var(--accent) 25%,#dcdce8);--text:#101018;--muted:#62627a;--ok:#0a9f63;--bad:#e0173f;--sh:0 8px 22px #1a1a4a22}
body{background:radial-gradient(900px 480px at 0 -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%),radial-gradient(700px 420px at 100% 0,color-mix(in srgb,var(--accent2) 12%,transparent),transparent 55%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:linear-gradient(#000,transparent 65%);mask-image:linear-gradient(#000,transparent 65%)}
.case,.stk,.pf,.rw,.lr,.chbox,.ev,.mb,.upbox{border-radius:var(--r);border:1px solid var(--line);background:var(--panel);box-shadow:var(--sh)}
.ev{border-color:var(--accent)}.case:hover,.lr:hover{border-color:var(--accent)}

h3::before{background:var(--accent)}
/* Акции: карточки и экран акции */
.stk{cursor:pointer;transition:.15s}.stk:hover{border-color:var(--accent)}.stk.up{border-left:3px solid var(--ok)}.stk.dn{border-left:3px solid var(--bad)}
#sd{gap:10px;max-width:640px;margin:0 auto;width:100%}
.sdh{display:flex;align-items:center;gap:10px}.sdh b{font-family:var(--fd);font-size:15px;flex:1}
.sdpr{font-family:var(--fd);font-size:30px;font-weight:700}
.sdw{position:relative;height:210px;flex:none;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;touch-action:pan-y}

.sdg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.sdg div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:11px;color:var(--muted)}.sdg b{display:block;font-size:13px;color:var(--text);margin-top:2px}
.qty{display:flex;gap:6px;margin:8px 0}.qty input{flex:1;min-width:0;text-align:center;font-size:20px;font-weight:800;background:var(--bg);color:var(--text);border:1px solid var(--line);padding:8px}.qty .btn{width:48px}

.sw{display:flex;flex-wrap:wrap;gap:12px}.sw button{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}.sw button.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg) inset}
#acPick{width:56px;height:42px;padding:0;border:1px solid var(--line);background:var(--panel);border-radius:8px}
.cdt{position:absolute;top:4px;right:4px;z-index:2;font-size:9px;font-weight:800;line-height:1.3;padding:1px 5px;border-radius:6px;color:#0a0a0a;text-shadow:none}
.insp{max-width:340px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.insp .card{width:210px;margin:0 auto;padding:18px 8px}.insp .card .ic{font-size:76px}.insp .card .nm{font-size:13px}.insp .card .cdt{font-size:12px;padding:2px 7px}
.idesc{display:flex;flex-direction:column;gap:6px;font-size:14px}.idesc>div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:5px}.idesc span{color:var(--muted)}.idesc .hint{display:block;border:0;margin:0}
.rst{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}.rst .top{display:flex;justify-content:space-between;gap:8px}.rst input[type=range]{accent-color:var(--accent);padding:0}
</style>
<script>
function applyAccent(h){var r=document.documentElement.style,m=/^#([0-9a-f]{6})$/i.exec(h)||/^#([0-9a-f]{6})$/i.exec("#c6ff00"),n=parseInt(m[1],16),R=n>>16&255,G=n>>8&255,B=n&255,rr=R/255,gg=G/255,bb=B/255,mx=Math.max(rr,gg,bb),mn=Math.min(rr,gg,bb),l=(mx+mn)/2,d=mx-mn,sa=d?d/(1-Math.abs(2*l-1)):0,hh=0;
 if(d){hh=mx===rr?((gg-bb)/d)%6:mx===gg?(bb-rr)/d+2:(rr-gg)/d+4;hh*=60;if(hh<0)hh+=360}
 r.setProperty("--accent","#"+m[1]);r.setProperty("--accent2","hsl("+Math.round((hh+55)%360)+","+Math.round(Math.max(70,sa*100))+"%,"+Math.round(Math.min(62,Math.max(48,l*100)))+"%)");r.setProperty("--on",(0.299*R+0.587*G+0.114*B)>150?"#0a0a0a":"#fff")}
function applyTheme(t){var e=document.documentElement;if(t==="dark"||t==="light")e.setAttribute("data-theme",t);else e.removeAttribute("data-theme")}
try{applyAccent(localStorage.getItem("kx_acc")||"#c6ff00");applyTheme(localStorage.getItem("kx_theme")||"auto")}catch(e){applyAccent("#c6ff00")}
</script>
<style>

.grid .item{animation:pop .35s both}.grid .item:nth-child(2n){animation-delay:.04s}.grid .item:nth-child(3n){animation-delay:.08s}

.btn{transition:transform .12s,filter .2s,box-shadow .2s}.btn:active:not(:disabled){transform:scale(.94)}.btn:hover:not(:disabled){filter:brightness(1.12)}
.stk{transition:transform .2s,box-shadow .2s}.stk:hover{transform:translateY(-2px)}
.pp{display:inline-block}.pp.fu{animation:fu .8s}.pp.fd{animation:fd .8s}
#bal,#gem{display:inline-block}.bump{animation:bump .4s}
.mb{animation:pop .3s both}

.dp .tb{transition:background .2s,transform .15s}.dp .tb:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function load(){try{const d=JSON.parse(localStorage.getItem("kx2_save")||"null");if(d&&typeof d.bal==="number"&&Array.isArray(d.inv)&&d.prof){S=Object.assign(def(),d);if(S.biz&&S.biz.length){S.bal+=Math.round(S.biz.reduce((t,b)=>t+(b.inv||0)*.5+Math.max(0,b.cash||0),0));S.biz=[]}}}catch(e){}}
function upd(){$("bal").textContent=fmt(S.bal);$("gem").textContent=fmt(S.gem);rHead();rCases();if(cur==="st")rSt();save()}
function rHead(){$("head").innerHTML=avHTML(S.prof.av,36)+`<span>${esc(S.prof.nick||tt("Игрок"))}</span>`}

/* Акции (общие для всех, каждые 10 минут) */
const EVT=6e5,GX=5000;let evS=-1;
function evNow(){const k=Math.floor(Date.now()/EVT),r=h32(k*7919+13),q=h32(k*104729+7);let e;
  if(r<.5){const c=Math.floor(q*13),p=[10,15,20,25][Math.floor(h32(k+99)*4)];e={t:"c",k:c,pct:p,txt:`${CASES[c].n} −${p}%`}}
  else if(r<.68)e={t:"all",pct:7,txt:tt("Все кейсы −7%")};
  else if(r<.84)e={t:"sell",txt:tt("Скупка: карточки продаются на 10% дороже")};
  else e={t:"gx",txt:tt("Курс гемов: 1 💎 = {0} $",fmt(GX*.7))};
  e.end=(k+1)*EVT;return e}
function disc(c){if(c.gem)return 0;const e=evNow();return e.t==="all"||(e.t==="c"&&e.k===c.id)?e.pct:0}
const cprice=c=>Math.round(c.price*(1-disc(c)/100)/10)*10;
const gxRate=()=>evNow().t==="gx"?GX*.7:GX;
const sellRate=()=>SELL+(evNow().t==="sell"?.1:0);
function rEv(){const e=evNow(),k=e.end/EVT-1,ch=evS>=0&&k!==evS;evS=k;
  if(ch){toast(tt("🔥 Новая акция: {0}",e.txt));rCases();return}
  const l=Math.max(0,Math.ceil((e.end-Date.now())/1000));
  $("evBox").innerHTML=`🔥 <b>${tt("Акция:")}</b> ${e.txt}<br><span class="hint">${tt("осталось {0}",Math.floor(l/60)+":"+String(l%60).padStart(2,"0"))}</span>`}

/* Магазин */
function rCases(){rEv();rDaily();rTax();rSnd();
  $("caseList").innerHTML=CASES.map(c=>{const p=cprice(c),d=disc(c),can=c.gem?S.gem>=c.gem:S.bal>=p,pr=c.gem?`${c.gem} 💎`:`${fmt(p)}`;
    return `<div class="case"><div class="big">${c.i}</div><b>${c.n}</b>${d?` <span class="bdg">−${d}%</span>`:""}<small>${c.cards.slice(-6).map(k=>CARDS[k].i).join(" ")}</small>${d?`<s>${fmt(c.price)}</s> `:""}<div class="r2"><button class="btn" data-a="bc" data-v="${c.id}|1" ${can?"":"disabled"}>${tt("Купить")} · ${pr}</button><button class="btn alt" data-a="bc" data-v="${c.id}|5" ${(c.gem?S.gem>=c.gem*5:S.bal>=p*5)?"":"disabled"}>×5</button></div></div>`}).join("");
  const g=gxRate();$("exch").innerHTML=`<div class="stk"><div class="top"><span>1 💎 = ${fmt(g)} $</span></div><div class="r2" style="margin-top:8px"><button class="btn" data-a="gx" data-v="1" ${S.bal>=g?"":"disabled"}>1 💎</button><button class="btn" data-a="gx" data-v="10" ${S.bal>=g*10?"":"disabled"}>10 💎</button></div></div>`;
  rOwn()}
function buyCase(id,n){const c=CASES[id];
  if(c.gem){const t=c.gem*n;if(S.gem<t){toast(tt("Не хватает гемов 💎"));return}S.gem-=t}
  else{const t=cprice(c)*n;if(S.bal<t){toast(tt("Не хватает $ 😕"));return}S.bal-=t}
  S.cases[id]=(S.cases[id]||0)+n;sfx("buy");toast(tt("{0} ×{1} → в Инвентаре",c.n,n));upd()}
function gx(n){const t=gxRate()*n;if(S.bal<t){toast(tt("Не хватает $ 😕"));return}S.bal-=t;S.gem+=n;sfx("coin");toast(`+${n} 💎`);upd()}
const LOCAL_PROMOS={BITCOINUP:{cs:{9:1}}};
async function promo(){
  const code=$("pcIn").value.toUpperCase().replace(/[^A-Z0-9А-ЯЁ_-]/g,""),msg=t=>$("pcMsg").textContent=t;
  if(!code){msg(tt("Введи код"));return}
  if(S.codes.includes(code)){msg(tt("Ты уже активировал этот код"));return}
  let p=LOCAL_PROMOS[code],remote=0;
  if(!p){if(!DB_URL){msg(tt("Код не найден (онлайн недоступен)"));return}
    try{p=await db("promos/"+code)}catch(e){msg(tt("Нет связи 😕"));return}remote=1}
  if(!p||typeof p!=="object"){msg(tt("Такого кода нет"));return}
  if(p.exp&&Date.now()>p.exp){msg(tt("Срок действия кода истёк"));return}
  if(p.maxbal&&S.bal>p.maxbal){msg(tt("Код только для игроков с балансом до {0} $",fmt(p.maxbal)));return}
  const used=p.used&&typeof p.used==="object"?p.used:{};
  if(used[S.uid]){msg(tt("Ты уже активировал этот код"));return}
  if(p.max&&Object.keys(used).length>=p.max){msg(tt("Лимит активаций исчерпан"));return}
  if(remote){try{await db(`promos/${code}/used/${S.uid}`,"PUT",true)}catch(e){msg(tt("Не удалось активировать"));return}}
  const kx=Math.min(Math.max(0,+p.kx||0),1e9),gm=Math.min(Math.max(0,+p.gem||0),1e6),got=[];
  if(kx){S.bal+=kx;got.push(fmt(kx)+" $")}if(gm){S.gem+=gm;got.push(gm+" 💎")}
  for(const[i,n]of Object.entries(p.cs||{})){const c=CASES[+i],q=Math.min(Math.max(0,+n||0),100);if(c&&q){S.cases[c.id]=(S.cases[c.id]||0)+q;got.push(`${q}× ${c.n}`)}}
  S.codes.push(code);$("pcIn").value="";msg(tt("Активирован ✅ Получено: {0}",got.join(", ")||tt("ничего")));toast(tt("Промокод активирован 🎟"));sfx("coin");fx(["🎟","✨"],24);upd()}
$("pcIn").onkeydown=e=>{if(e.key==="Enter")promo()};

/* Звуки и эффекты */
let AC=null;
function sfx(k,t){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  const n=(f,at,d,ty,v)=>{const o=AC.createOscillator(),g=AC.createGain(),T=AC.currentTime+at;o.type=ty||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(v||.15,T+.01);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g);g.connect(AC.destination);o.start(T);o.stop(T+d+.02)};
  if(k==="tick")n(900,0,.05,"square",.05);
  else if(k==="coin"){n(988,0,.1,"triangle");n(1319,.09,.18,"triangle")}
  else if(k==="buy"){n(600,0,.08,"triangle");n(800,.07,.1,"triangle")}
  else if(k==="win"){const sc=[523,659,784,1047,1319,1568];for(let i=0;i<Math.min(1+t,6);i++)n(sc[i],i*.1,.25+(t>=4?.2:0),"triangle",.14);if(t>=5)n(2093,.65,.7,"sine",.18)}
}catch(e){}}
function fx(em,n,flash){const b=document.createElement("div");b.className="fx";if(flash)b.innerHTML=`<div class="fl" style="background:${flash}"></div>`;
  for(let i=0;i<n;i++){const e=document.createElement("i");e.textContent=em[i%em.length];e.style.cssText=`left:${Math.random()*100}%;--dx:${(Math.random()-.5)*160}px;animation-delay:${Math.random()*.6}s;font-size:${16+Math.random()*18}px`;b.appendChild(e)}
  document.body.appendChild(b);setTimeout(()=>b.remove(),3500)}
function winFx(t){if(t===3)fx(["✨"],14);else if(t===4)fx(["✨","⭐","💫"],40,"#ff5cc833");
  else if(t>=5){fx(["👑","✨","🌟","💎","🪙"],90,"#ffc83d66");document.body.classList.add("shake");setTimeout(()=>document.body.classList.remove("shake"),700)}}
function rSnd(){$("snd").textContent=S.snd?tt("🔊 Звук: вкл"):tt("🔇 Звук: выкл")}
$("snd").onclick=()=>{S.snd=!S.snd;rSnd();save();sfx("coin")};

/* Ежедневный бонус */
const dkey=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dayGap=()=>S.daily.d?Math.round((Date.parse(dkey())-Date.parse(S.daily.d))/864e5):99;
const dRew=n=>({kx:500*n+(n===7?2500:0),gem:n===3?1:n===7?3:0});
function dState(){const g=dayGap(),can=g>=1,ns=can?(g===1?S.daily.s+1:1):S.daily.s;return{can,ns,day:can?(ns-1)%7+1:S.daily.s%7+1}}
function rDaily(){const d=dState();
  $("dailyBox").innerHTML=`<div class="top"><b>🎁 ${tt("Ежедневный бонус")}</b><span class="hint">${tt("серия: {0} дн.",S.daily.s)}</span></div><div class="chips" style="margin:8px 0">${[1,2,3,4,5,6,7].map(i=>{const r=dRew(i);return `<span class="chip" style="${i===d.day?"border-color:var(--accent)":""}">${i}: ${fmt(r.kx)}${r.gem?" +"+r.gem+"💎":""}</span>`}).join("")}</div><button class="btn" style="width:100%" data-a="daily" ${d.can?"":"disabled"}>${d.can?tt("Забрать бонус"):tt("Следующий бонус завтра")}</button>`}
function claimDaily(){const d=dState();if(!d.can)return;const r=dRew(d.day);
  S.daily={d:dkey(),s:d.ns};S.bal+=r.kx;S.gem+=r.gem;sfx("coin");fx(["🪙","💰","✨"],30);toast(`${tt("День")} ${d.day}: +${fmt(r.kx)} $${r.gem?` +${r.gem} 💎`:""}`);upd()}

/* Налог на богатство */
const TAX_FREE=2e5,TAX_HI=5e5,TR1=.02,TR2=.05;
const taxDay=b=>Math.max(0,Math.min(b,TAX_HI)-TAX_FREE)*TR1+Math.max(0,b-TAX_HI)*TR2;
function taxTick(){const m=(Date.now()-S.taxTs)/6e4;if(m<1)return 0;S.taxTs=Date.now();
  const t=Math.min(Math.floor(taxDay(S.bal)*Math.min(m,4320)/1440),Math.floor(S.bal*.5));if(t>0){S.bal-=t;S.taxPaid+=t}return t}
function rTax(){$("taxInfo").textContent=`🏛 ${tt("Налог на богатство")}: ${fmt(taxDay(S.bal))} $ ${tt("в сутки")} · ${tt("уплачено всего")}: ${fmt(S.taxPaid)} $`}

/* Инвентарь: кейсы */
function rOwn(){const L=CASES.filter(c=>S.cases[c.id]>0),tot=L.reduce((t,c)=>t+S.cases[c.id],0);
  $("ownCases").innerHTML=L.map(c=>`<div class="case"><div class="big">${c.i}</div><b>${c.n}</b> <span class="chip">×${S.cases[c.id]}</span><small>${c.cards.slice(-6).map(k=>CARDS[k].i).join(" ")}</small><button class="btn" data-a="case" data-v="${c.id}" ${busy?"disabled":""}>${tt("Открыть")}</button><div class="r2">${S.cases[c.id]>10?`<button class="btn alt" data-a="mopen" data-v="${c.id}|10" ${busy?"disabled":""}>×10</button>`:""}${S.cases[c.id]>1?`<button class="btn alt" data-a="mopen" data-v="${c.id}|100" ${busy?"disabled":""}>${tt("Все")} (${Math.min(100,S.cases[c.id])})</button>`:""}</div></div>`).join("")||'<span class="hint">${tt("Нет кейсов")}</span>';
  $("itc").textContent=`${tt("Кейсы")} (${tot})`;$("itk").textContent=`${tt("Карты")} (${S.inv.length})`}
function itab(v){invTab=v;$("invC").hidden=v!=="c";$("invK").hidden=v!=="k";$("invF").hidden=v!=="f";$("itc").classList.toggle("alt",v!=="c");$("itk").classList.toggle("alt",v!=="k");$("itf").classList.toggle("alt",v!=="f");if(v==="f")rCraft()}
function openCase(cs){
  if(busy||!(S.cases[cs.id]>0))return;
  busy=true;S.cases[cs.id]--;sfx("init");$("rw").style.display="";upd();
  const items=[];for(let i=0;i<45;i++)items.push(roll(cs));
  const WIN=38,win=items[WIN],strip=$("strip");
  strip.style.transition="none";strip.style.transform="translateX(0)";
  strip.innerHTML=items.map(cardHTML).join("");$("res").innerHTML="";
  void strip.offsetWidth;

  strip.style.transition="transform 5.5s cubic-bezier(.12,.7,.1,1)";
  strip.style.transform=`translateX(${-x}px)`;
  for(let i=1;i<=38;i++)setTimeout(()=>sfx("tick"),5500*(1-Math.pow(1-i/38,1/3)));
  setTimeout(()=>{
    const it=newItem(win);S.inv.push(it);busy=false;const gd=Math.random()<.2?1+rn(2):0;S.gem+=gd;const tr=tier(val(win));sfx("win",tr);winFx(tr);
    $("res").innerHTML=`${cardHTML(win)}<div>${tt("Выпало:")} <b>${CARDS[win.c].n}</b> · ${tt("фон")} «${BGS[win.g].n}»</div>${gd?`<div class="good">+${gd} 💎</div>`:""}<button class="btn alt" id="sellNow" style="margin-top:8px">${tt("Продать за")} ${fmt(val(win)*sellRate())} $</button>`;
    $("sellNow").onclick=()=>{sell(it.id);$("res").innerHTML=tt("Продано ✅")};

  },5700);

/* Рынок: общий для всех игроков */
let MB=0,bBusy=0,lBusy=0;const MAXL=12;
function rMarket(){
  $("mine").innerHTML=S.list.length?S.list.map(l=>`<div class="item">${cardHTML(l)}<div class="sub">${tt("Твоя цена:")} <b>${fmt(l.price)}</b></div><button class="btn alt sm" data-a="unlist" data-v="${esc(l.id)}">${tt("Снять")}</button></div>`).join(""):`<span class="hint">${tt("Пусто")}</span>`;
  const L=M.filter(l=>l.s!==S.uid);
  $("mlots").innerHTML=L.length?L.slice().sort((a,b)=>a.price/val(a)-b.price/val(b)).map(l=>{const r=l.price/val(l);return `<div class="item">${cardHTML(l)}<div class="sub">${esc(l.sn)}</div><button class="btn sm" data-a="buy" data-v="${esc(l.id)}" ${S.bal<l.price?"disabled":""}>${tt("Купить")} ${fmt(l.price)} <span class="${r<1?"good":"bad"}">(${Math.round(r*100)}%)</span></button></div>`}).join(""):`<span class="hint">${DB_URL?tt("Пока нет лотов"):tt("Онлайн недоступен")}</span>`}
async function pollMarket(){if(!DB_URL||MB)return;MB=1;
  try{const d=await db("market")||{};
    M=Object.entries(d).map(([k,v])=>{if(!v||typeof v!=="object")return null;const c=safeCard(v),p=Math.round(+v.p);
      if(!c||!okId(String(v.s||""))||!(p>=10))return null;
      return{id:k,c:c.c,g:c.g,cn:c.cn,price:Math.min(p,1e9),s:String(v.s),sn:String(v.sn||"Игрок").slice(0,16)}}).filter(Boolean);
    if(cur==="mk")rMarket()}catch(e){}MB=0}
/* забрать лот из базы: удаляет только если он ещё там (по возможности атомарно) */
async function claim(p){const u=`${DB_URL}/${p}.json`;let et=null,v;
  try{const r=await fetch(u,{headers:{"X-Firebase-ETag":"true"}});if(!r.ok)throw 0;et=r.headers.get("ETag");v=await r.json()}catch(e){v=await db(p)}
  if(!v||typeof v!=="object")return null;
  let r=null;
  if(et){try{r=await fetch(u,{method:"DELETE",headers:{"if-match":et}})}catch(e){r=null}if(r&&r.status===412)return null}
  if(!r||!r.ok){r=await fetch(u,{method:"DELETE"});if(!r.ok)throw 0}
  return v}
async function buy(k){if(!DB_URL||bBusy)return;const l=M.find(x=>x.id===k);
  if(!l){toast(tt("Лот уже купили"));return}
  if(l.s===S.uid)return;
  if(S.bal<l.price){toast(tt("Не хватает $ 😕"));return}
  bBusy=1;
  try{const v=await claim("market/"+k),c=v&&safeCard(v),p=v&&Math.round(+v.p);
    if(!c||!(p>=10)){M=M.filter(x=>x.id!==k);rMarket();toast(tt("Лот уже купили"));bBusy=0;return}
    S.bal-=p;S.inv.push(newItem(c));M=M.filter(x=>x.id!==k);
    toast(tt("Куплено: {0}",CARDS[c.c].n));upd();rMarket();rInv();
    const to=String(v.s||"");
    if(okId(to))for(let a=0;a<3;a++){try{await db(`inbox/${to}`,"POST",{t:"sold",lk:k,kx:Math.round(p*FEE),fn:String(S.prof.nick||"Игрок").slice(0,16),ts:Date.now()});break}catch(e){await new Promise(r=>setTimeout(r,800))}}}
  catch(e){toast(tt("Нет связи 😕"))}bBusy=0}
function openList(id){const c=S.inv.find(x=>x.id===id);if(!c)return;
  $("modal").innerHTML=`<div class="mb">${cardHTML(c)}<div class="hint" style="margin:0">${tt("Рыночная цена ≈ {0} $",fmt(val(c)))}</div><input id="pr" type="number" min="10" value="${val(c)}"><button class="btn" data-a="doList" data-v="${id}" style="width:100%">${tt("Выставить")}</button><button class="btn alt" data-a="close" style="width:100%">${tt("Отмена")}</button></div>`;
  $("modal").classList.add("on")}
async function doList(id){const p=Math.round(+$("pr").value);if(!(p>=10)){toast(tt("Укажи цену от 10 $"));return}
  if(!DB_URL){toast(tt("Онлайн недоступен"));return}
  if(S.list.length>=MAXL){toast(tt("Максимум {0} лотов",MAXL));return}
  if(lBusy)return;const i=S.inv.findIndex(x=>x.id===id);if(i<0)return;const c=S.inv[i];lBusy=1;

    const j=S.inv.findIndex(x=>x.id===id);if(j>=0)S.inv.splice(j,1);S.prof.show=S.prof.show.filter(x=>x!==id);

  catch(e){toast(tt("Нет связи 😕"))}lBusy=0}
async function unlist(k){const i=S.list.findIndex(x=>x.id===k);if(i<0||!DB_URL||bBusy)return;bBusy=1;
  try{const v=await claim("market/"+k),c=v&&safeCard(v);

    S.list=S.list.filter(x=>x.id!==k);S.inv.push(newItem(c));M=M.filter(x=>x.id!==k);save();rMarket();rInv();rProf()}
  catch(e){toast(tt("Нет связи 😕"))}bBusy=0}
function closeM(){$("modal").classList.remove("on")}
function tick(){
  checkGifts();rEv();if(Date.now()-S.taxTs>=6e4){if(taxTick()>0)upd();else save()}if(cnt%30===0&&cur==="cases")rDaily();
  if(mkSync()&&cur==="st")rSt();
  
  if(cur==="st")$("stInfo").textContent=tt("Обновление через {0} с · портфель ≈ {1} $",Math.max(0,Math.ceil(((MK.step+1)*STEP-Date.now())/1000)),fmt(STK.reduce((t,a)=>t+(S.st[a.k]||0)*MK.p[a.k],0)));

}

/* Профиль */
function rProf(){
  const stv=STK.reduce((a,x)=>a+(S.st[x.k]||0)*MK.p[x.k],0);
  S.prof.show=S.prof.show.filter(id=>S.inv.some(x=>x.id===id));

function rOffers(){const ks=Object.keys(IN);
  $("offers").innerHTML=ks.length?`<h3>${tt("Приглашения на обмен")}</h3>`+ks.map(k=>{const o=IN[k];return `<div class="stk"><div class="top"><span>${avHTML(o.fa,28)} <b>${esc(o.fn)}</b> ${tt("предлагает карточку:")}</span></div><div class="show" style="justify-content:center;margin:8px 0">${cardHTML(o.c)}</div><div class="row"><button class="btn" data-a="tacc" data-v="${k}" ${S.bal<o.pk?"disabled":""}>${o.pk?tt("Купить за {0} $",fmt(o.pk)):tt("Взять даром")}</button><button class="btn alt" data-a="tdec" data-v="${k}">${tt("Отклонить")}</button></div></div>`}).join(""):"";
  $("outs").innerHTML=S.out.length?`<h3>${tt("Мои предложения")}</h3>`+S.out.map(o=>`<div class="stk"><div class="top"><span>${CARDS[o.c.c].i} ${CARDS[o.c.c].n} → <b>${esc(o.tn||"")}</b> · ${o.pk?fmt(o.pk)+" $":tt("подарок")}</span><button class="btn alt sm" data-a="tcan" data-v="${o.k}">${tt("Отозвать")}</button></div></div>`).join(""):""}
async function accOffer(k){const o=IN[k];if(!o)return;if(S.bal<o.pk){toast(tt("Не хватает $ 😕"));return}
  try{if(!await db(`inbox/${S.uid}/${k}`)){toast(tt("Предложение уже отозвано"));delete IN[k];rOffers();rBdg();return}
    await db(`inbox/${S.uid}/${k}`,"DELETE");S.bal-=o.pk;S.inv.push(newItem(o.c));delete IN[k];
    await db(`inbox/${o.f}`,"POST",{t:"acc",ok:k,kx:Math.round(o.pk*FEE),fn:String(S.prof.nick).slice(0,16),ts:Date.now()});
    toast(tt("Получено: {0}",CARDS[o.c.c].n));upd();rInv();rProf();rOffers();rBdg()}catch(e){toast(tt("Нет связи 😕"))}}
async function decOffer(k){const o=IN[k];if(!o)return;
  try{await db(`inbox/${S.uid}/${k}`,"DELETE");await db(`inbox/${o.f}`,"POST",{t:"ret",ok:k,gc:{c:o.c.c,g:o.c.g,cn:o.c.cn},ts:Date.now()});delete IN[k];rOffers();rBdg()}catch(e){toast(tt("Нет связи 😕"))}}
async function cancelOut(k){const o=S.out.find(x=>x.k===k);if(!o)return;
  try{if(!await db(`inbox/${o.to}/${k}`)){toast(tt("Уже обработано, жди ответ"));return}await db(`inbox/${o.to}/${k}`,"DELETE");
    S.out=S.out.filter(x=>x!==o);S.inv.push(newItem(o.c));upd();rInv();rProf();rTrade()}catch(e){toast(tt("Нет связи 😕"))}}
function setLang(v){if(v!=="ru"&&v!=="en")return;S.lang=v;save();location.reload()}
function copyId(){const f=()=>toast(tt("ID скопирован"));try{navigator.clipboard.writeText(S.uid).then(f,()=>toast(S.uid))}catch(e){toast(S.uid)}}
detectDb().then(()=>{pollIn();pollMarket();pullStocks()});
setInterval(tick,1000);

/* Крафт */
const CR=new Set();
const crSel=()=>S.inv.filter(c=>CR.has(c.id));
function crRes(){const L=crSel();if(L.length<2)return null;const g=L[0].g;if(g+1>=BGS.length)return{max:1};
  const tot=L.reduce((s,c)=>s+val(c),0),b=BGS[g+1].b;let best=-1,d=1/0;
  CARDS.forEach((k,i)=>{if(k.rare)return;const x=Math.abs(k.p+b-tot);if(x<d){d=x;best=i}});return{c:best,g:g+1,tot}}
function rCraft(){for(const id of[...CR])if(!S.inv.some(c=>c.id===id))CR.delete(id);
  const L=crSel(),g=L.length?L[0].g:-1,r=crRes();
  $("crList").innerHTML=S.inv.filter(c=>g<0||c.g===g).sort((a,b)=>a.g-b.g||val(b)-val(a)).slice(0,80).map(c=>`<div class="item ${CR.has(c.id)?"pick":""}" data-a="crp" data-v="${c.id}">${cardHTML(c)}</div>`).join("")||`<span class="hint">${tt("Нет карточек")}</span>`;
  $("crInfo").innerHTML=!L.length?"Выбери карты с одинаковым фоном":L.length<2?"Нужна ещё хотя бы одна карта":r.max?"Фон уже максимальный":`Сумма ${fmt(r.tot)} $ → результат:<div style="width:130px;margin:8px auto">${cardHTML({c:r.c,g:r.g,cn:100})}</div>`;
  $("crBtn").disabled=!r||!!r.max;rSets()}
function crPick(id){if(CR.has(id))CR.delete(id);else{if(CR.size>=6){toast("Максимум 6 карт");return}CR.add(id)}sfx("init");rCraft()}
function doCraft(){const L=crSel(),r=crRes();if(L.length<2||!r||r.max)return;
  S.inv=S.inv.filter(c=>!CR.has(c.id));S.prof.show=S.prof.show.filter(x=>!CR.has(x)&&!CR.has(x&&x.id));CR.clear();
  const it=newItem({c:r.c,g:r.g,cn:100});S.inv.push(it);sfx("win",tier(val(it)));fx(["🔨","✨","💥","⭐"],26,"rgba(255,190,60,.22)");
  $("crRes").innerHTML=cardHTML(it);toast("Скрафчено: "+CARDS[it.c].n);upd();rInv();rProf();rCraft()}
/* Сеты: рецепты из любых карт. Ингредиенты нужны по одной штуке (любой фон), результат получает лучший фон из них */
const SETR="🍗🥬>🍱,🍞🧀>🥪,🍅🥬>🥗,🍚🐟>🍣,🥚🥓>🍳,🌽🔥>🍿,☀️🌧️>🌈,☀️☁️>⛅,❄️☁️>🌨️,🔥💧>♨️,🌙⭐>🌌,🐶🐱>🐾,🐝🌻>🍯,🐸👑>🤴,🚀🌙>🛸,🧙🔮>🪄,💎🪙>💰,🎸🎧>🎶,⚽🏆>🥇,🐉🔥>🌋,🦄🌈>✨,🍕🍔🍟>🎉,🐺🌙>🌕,🍓🥛>🍦,🦁🐯🐻>🏕️,🍎🍌🍇>🧺,👻💀🎃>🏚️,🌹💍>💐,⚡🔋>🔌,🦊🦉🐺>🌲".replace(/\uFE0F/g,"");
let _SL=null;const ciE=e=>CARDS.findIndex(k=>k.i.replace(/\uFE0F/g,"")===e);
const SETL=()=>_SL||(_SL=SETR.split(",").map((r,id)=>{const[a,o]=r.split(">");return{id,in:Array.from(a).map(ciE),out:ciE(o)}}).filter(x=>x.in.every(i=>i>=0)&&x.out>=0&&!x.in.includes(x.out)));
function rSets(){const L=SETL(),D=S.sets||{};$("setInfo").textContent=`Собрано: ${L.filter(x=>D[x.id]).length}/${L.length} · первый раз за сет +2 💎. Нужна по одной карте каждого вида (фон любой).`;
  $("setList").innerHTML=L.map(x=>{const has=x.in.map(i=>S.inv.some(c=>c.c===i)),ok=has.every(Boolean);
    return `<div class="stk set ${ok?"rdy":""}"><div class="top"><span>${x.in.map((i,k)=>`<span class="${has[k]?"":"dim"}">${CARDS[i].i}</span>`).join(" + ")} → <b>${CARDS[x.out].i}</b> ${CARDS[x.out].n}${D[x.id]?" ✅":""}</span><button class="btn sm" data-a="mkset" data-v="${x.id}" ${ok?"":"disabled"}>Собрать</button></div></div>`}).join("")}
function mkSet(id){const x=SETL().find(q=>q.id===id);if(!x)return;const use=[];
  for(const i of x.in){const c=S.inv.filter(q=>q.c===i&&!use.includes(q)).sort((a,b)=>val(a)-val(b))[0];if(!c){toast("Не хватает карт для сета");return}use.push(c)}
  const g=Math.max(...use.map(c=>c.g)),ids=new Set(use.map(c=>c.id));S.inv=S.inv.filter(c=>!ids.has(c.id));S.prof.show=S.prof.show.filter(q=>!ids.has(q)&&!ids.has(q&&q.id));
  const it=newItem({c:x.out,g,cn:100});S.inv.push(it);S.sets=S.sets||{};let t="Сет собран: "+CARDS[x.out].n;if(!S.sets[id]){S.sets[id]=1;S.gem+=2;t+=" · +2 💎"}
  sfx("win",tier(val(it)));fx(["🧩","✨",CARDS[x.out].i],24,"rgba(120,200,255,.2)");toast(t);upd();rInv();rProf();rCraft()}
/* Анимации: вспышка цены акции и пульс баланса */
(()=>{const pv=new WeakMap();
  new MutationObserver(ms=>{for(const m of ms){const t=m.target.nodeType===3?m.target.parentElement:m.target;if(!t||!t.classList||!t.classList.contains("pp"))continue;
    const v=parseInt(t.textContent.replace(/\D/g,""))||0,o=pv.get(t);pv.set(t,v);if(o!=null&&o!==v){t.classList.remove("fu","fd");void t.offsetWidth;t.classList.add(v>o?"fu":"fd")}}}).observe($("stList"),{childList:true,subtree:true,characterData:true});
  let ob=null;new MutationObserver(()=>{const e=$("bal"),v=e.textContent;if(ob!=null&&ob!==v){e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}ob=v}).observe($("bal"),{childList:true,characterData:true,subtree:true})})();

/* Меню: индексы для каскадного появления и состояние бургера */
document.querySelectorAll(".dp>*").forEach((e,i)=>e.style.setProperty("--i",i));
new MutationObserver(()=>$("mbtn").classList.toggle("open",$("drawer").classList.contains("on"))).observe($("drawer"),{attributes:true,attributeFilter:["class"]});

/* Заставка: показать ~2.6 с и плавно перейти в игру */
setTimeout(()=>{const e=$("splash");if(e){e.classList.add("out");setTimeout(()=>e.remove(),1000)}},2600);
</script>
